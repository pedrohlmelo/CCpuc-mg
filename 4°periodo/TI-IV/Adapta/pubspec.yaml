name: adapta
description: "Adapta — protótipo de telas e navegação do app de estudos por questões (TI-IV)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

# Protótipo de telas e navegação: sem banco de dados e sem chamadas de rede.
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^18.0.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/mascote/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fontes/PlusJakartaSans.ttf
        - asset: assets/fontes/PlusJakartaSans-Italic.ttf
          style: italic

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icone/icone.png
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: assets/icone/icone_foreground.png
  adaptive_icon_monochrome: assets/icone/icone_foreground.png
