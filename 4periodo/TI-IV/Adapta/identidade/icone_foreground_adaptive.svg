    <!-- corpo + cabeça -->
    <ellipse cx="520" cy="620" rx="260" ry="190" fill="url(#corpo)"/>
    <circle cx="620" cy="470" r="170" fill="url(#corpo)"/>
    <!-- barriga e pintas -->
