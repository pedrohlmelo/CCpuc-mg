name: adapta
description: "Adapta — app de estudos por questões para o ENEM (TI-IV)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cached_network_image: ^4.0.3
  cloud_firestore: ^7.1.0
  connectivity_plus: ^7.3.2
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.8
  flutter_riverpod: ^2.6.1
  go_router: ^18.0.1
  path: ^1.9.1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.5
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.4.5
  fake_cloud_firestore: ^4.5.0
  firebase_auth_mocks: ^0.16.0
  mock_exceptions: ^0.8.2

flutter:
  uses-material-design: true
  assets:
    - assets/mascote/
    - assets/questoes/
    - assets/modelos/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fontes/PlusJakartaSans.ttf
        - asset: assets/fontes/PlusJakartaSans-Italic.ttf
          style: italic

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icone/icone.png
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: assets/icone/icone_foreground.png
  adaptive_icon_monochrome: assets/icone/icone_foreground.png
